name: PSScriptAnalyzer

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
  pull_request:
    branches: [ "main" ]
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"

jobs:
  analyze:
    name: Run PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost,PSUseBOMForUnicodeEncodedFile

          if ($results) {
            $results | Format-Table -AutoSize
          }

          $errors = $results | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) {
            Write-Error "PSScriptAnalyzer found $($errors.Count) blocking error(s)."
            exit 1
          } else {
            Write-Host "No blocking PSScriptAnalyzer errors found." -ForegroundColor Green
          }
