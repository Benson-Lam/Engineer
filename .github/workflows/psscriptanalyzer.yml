name: PSScriptAnalyzer

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"
  pull_request:
    branches: [ "main" ]
    paths:
      - "**/*.ps1"
      - "**/*.psm1"
      - "**/*.psd1"

jobs:
  analyze:
    name: Run PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)."
            exit 1
          } else {
            Write-Host "No PSScriptAnalyzer issues found." -ForegroundColor Green
          }
